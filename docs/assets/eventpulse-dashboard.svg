<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">EventPulse live feedback analytics dashboard prototype</title>
  <desc id="desc">Animated organizer dashboard with four charts: response trends, responses by event, rating distribution, and voice feedback coverage.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1400" y2="910" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f9f6f6"/>
      <stop offset="1" stop-color="#f1edf0"/>
    </linearGradient>
    <linearGradient id="line" x1="172" y1="413" x2="665" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7a1f2b"/>
      <stop offset="1" stop-color="#d4a94f"/>
    </linearGradient>
    <linearGradient id="bar" x1="825" y1="414" x2="825" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7a1f2b"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="voice" x1="1000" y1="743" x2="1205" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7a1f2b"/>
      <stop offset="1" stop-color="#d2ad59"/>
    </linearGradient>
    <filter id="cardShadow" x="18" y="20" width="1380" height="870" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#3b1e2a" flood-opacity=".055"/>
    </filter>
  </defs>
  <style>
    .card { fill: #fff; stroke: #eee8eb; stroke-width: 1.2; }
    .eyebrow { fill: #90838b; font: 12px Inter,Segoe UI,Arial,sans-serif; letter-spacing: 1.3px; }
    .heading { fill: #352833; font: 700 18px Inter,Segoe UI,Arial,sans-serif; }
    .label { fill: #9b9096; font: 11px Inter,Segoe UI,Arial,sans-serif; }
    .grid { stroke: #eee9ec; stroke-width: 1; }
    .live { animation: beat 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 4.5s ease-in-out infinite alternate; }
    .bar-a { animation: rise 2.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .bar-b { animation: rise 3.2s ease-in-out .3s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .bar-c { animation: rise 2.6s ease-in-out .6s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .bar-d { animation: rise 3.4s ease-in-out .15s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .scan { animation: scan 3.8s ease-in-out infinite; }
    @keyframes beat { 0%,100% { opacity: .6; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rise { from { transform: scaleY(.75); } to { transform: scaleY(1); } }
    @keyframes scan { 0%,100% { opacity: .15; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) {
      .live, .draw, .bar-a, .bar-b, .bar-c, .bar-d, .scan { animation: none; }
      .draw { stroke-dashoffset: 0; }
    }
  </style>

