services:
  - type: web
    name: eventpulse
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECRET
        generateValue: true
      - key: OWNER_NAME
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: MEDIA_UPLOAD_DIR
        value: /tmp/eventpulse-uploads
      - key: VOICE_FEEDBACK_DIR
        value: /tmp/eventpulse-feedback-audio
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_MEDIA_BUCKET
        value: eventpulse-media
      - key: SUPABASE_VOICE_BUCKET
        value: eventpulse-voice
      - key: MAX_UPLOAD_MB
        value: 15
      - key: MAX_VOICE_FEEDBACK_MB
        value: 25
